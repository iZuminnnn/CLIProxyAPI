services:
  cli-proxy-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cli-proxy-api-dev
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Mount config files
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/app/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-/home/cookiebear/.cli-proxy-api}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/app/logs
      # Persist go modules cache for faster rebuilds
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    restart: unless-stopped

volumes:
  go-mod-cache:
  go-build-cache:
